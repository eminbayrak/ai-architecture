[project]
name = "ai-architecture"
version = "0.1.0"
description = "AI Architect kit: LangGraph crew with cost-aware model routing plus portable agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "pyyaml>=6",
]

[project.scripts]
fde-crew = "agents.graphs.fde_crew:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[dependency-groups]
dev = ["pytest>=8", "sqlite-vec", "model2vec"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/fde-kb/tests", "skills/jira/tests", "skills/graph-memory/tests", "skills/llm-wiki/tests", "skills/retrieval-bench/tests"]
markers = [
  "model2vec: live Model2Vec (needs local weights or FDE_KB_LIVE_EMBED=1)",
]
