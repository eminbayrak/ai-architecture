# Add these entries under `tools:` in the FastMCP server's mcp_tools.yaml.
# `script` is relative to the folder that holds mcp_tools.yaml. The paths below fit this layout:
#   <repo>/mcp/mcp_tools.yaml
#   <repo>/knowledge-base/domains/fde/skills/databricks/scripts/dbx_mcp.py
# register_mcp.py computes the path itself, so the skill can live anywhere.
# Forward slashes work on Windows and macOS.
# The server builds each tool's input schema from the Python signature in dbx_mcp.py.
# The `parameters` blocks match that signature for the server's name check.

- name: fde-databricks-setup
  description: "Databricks setup check - Check the Databricks CLI and every workspace login. Run first on a new machine. fix=true installs or upgrades the CLI."
  script: ../knowledge-base/domains/fde/skills/databricks/scripts/dbx_mcp.py
  function_name: databricks_setup
  parameters:
    fix:
      type: boolean
      required: false
      description: "Install or upgrade the Databricks CLI if it is missing or too old"

- name: fde-databricks-login
  description: "Databricks login - Open the browser so the user signs in to a workspace with company SSO. Returns at once. Call fde-databricks-setup after the user finishes."
  script: ../knowledge-base/domains/fde/skills/databricks/scripts/dbx_mcp.py
  function_name: databricks_login
  parameters:
    workspace_url:
      type: string
      required: true
      description: "Workspace URL from the browser address bar, or an existing profile name"
    name:
      type: string
      required: false
      description: "Short profile name to save, for example ws13"

- name: fde-databricks-sql
  description: "Databricks SQL (read-only) - Run one SELECT, WITH, VALUES, SHOW, DESCRIBE or EXPLAIN statement and return rows as JSON. Adds LIMIT 1000 when the query has none."
  script: ../knowledge-base/domains/fde/skills/databricks/scripts/dbx_mcp.py
  function_name: databricks_sql
  parameters:
    query:
      type: string
      required: true
      description: "One read-only SQL statement. Use :name markers for values"
    workspace:
      type: string
      required: false
      description: "Profile name from .databrickscfg, for example ws13"
    params:
      type: object
      required: false
      description: "Values for :name markers. Key name or name:TYPE"
    limit:
      type: number
      required: false
      description: "Row limit added when the query has none. 0 means no limit"

- name: fde-databricks-schema
  description: "Databricks table schema - Columns, types and descriptions for catalog.schema.table names. Use before writing SQL."
  script: ../knowledge-base/domains/fde/skills/databricks/scripts/dbx_mcp.py
  function_name: databricks_schema
  parameters:
    tables:
      type: array
      required: true
      description: "Full table names: catalog.schema.table"
    workspace:
      type: string
      required: false
      description: "Profile name from .databrickscfg, for example ws13"

- name: fde-databricks-compute
  description: "Databricks compute - List SQL warehouses and clusters for a workspace, or save which one SQL runs on (warehouse:<id> or cluster:<id>)."
  script: ../knowledge-base/domains/fde/skills/databricks/scripts/dbx_mcp.py
  function_name: databricks_compute
  parameters:
    workspace:
      type: string
      required: false
      description: "Profile name from .databrickscfg, for example ws13"
    use:
      type: string
      required: false
      description: "warehouse:<id> or cluster:<id>. Leave empty to list the options"
